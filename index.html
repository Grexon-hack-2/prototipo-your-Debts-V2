<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your-Debts: control de fiados y abonos para tiendas de barrio.">
  <title>Ingresar · Your-Debts</title>
  <link rel="stylesheet" href="css/estilos.css">
  <!-- defer: descarga en paralelo y ejecuta en orden, después de construir el DOM -->
  <script src="js/calculos.js" defer></script>
  <script src="js/modelos.js" defer></script>
  <script src="js/datos-demo.js" defer></script>
  <script src="js/api-simulada.js" defer></script>
  <script src="js/inspector-http.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <h1 class="marca">Your-Debts</h1>
    <p class="subtitulo">Fiados, abonos e inventario de tu tienda</p>

    <!-- Sin JavaScript, el navegador envía este formulario por POST con application/x-www-form-urlencoded.
         Con JavaScript, login.js valida, envía JSON y muestra el intercambio HTTP. -->
    <form id="form-login" action="/api/auth/login" method="post" enctype="application/x-www-form-urlencoded" autocomplete="on">
      <fieldset>
        <legend>Ingreso del comerciante</legend>

        <div class="campo">
          <label for="userName">Usuario</label>
          <input id="userName" name="userName" type="text" required minlength="3" maxlength="40"
                 pattern="[A-Za-z0-9._\-]+" autocomplete="username" autocapitalize="none" spellcheck="false"
                 aria-describedby="userName-ayuda userName-error">
          <small id="userName-ayuda" class="ayuda">Letras, números, punto, guion o guion bajo.</small>
          <small id="userName-error" class="error" aria-live="polite"></small>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="con-boton">
            <input id="password" name="password" type="password" required minlength="8" maxlength="128"
                   autocomplete="current-password" aria-describedby="password-error">
            <button type="button" class="boton-texto" id="ver-clave" aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
          <small id="password-error" class="error" aria-live="polite"></small>
        </div>
      </fieldset>

      <p id="login-mensaje" class="mensaje" role="alert" hidden></p>
      <button type="submit" class="boton-principal">Ingresar</button>
      <p class="nota">Demostración: usuario <code>tienda017</code>, contraseña <code>Fiado-2026</code>.</p>
    </form>
  </main>

  <aside id="inspector" class="inspector" aria-label="Intercambio HTTP">
    <h2>Intercambio HTTP</h2>
    <p data-http="estado" class="inspector-estado">Envíe el formulario para ver la solicitud.</p>
    <h3>Solicitud</h3>
    <pre data-http="solicitud"></pre>
    <h3>Respuesta</h3>
    <pre data-http="respuesta"></pre>
  </aside>
  <noscript><p class="mensaje">Active JavaScript para ver la validación inmediata y el intercambio HTTP.</p></noscript>
</body>
</html>
